<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="100%" stop-color="#4A0E0E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <!-- Phone Case Silhouette -->
  <rect x="36" y="20" width="56" height="88" rx="14" fill="#2A0808" stroke="url(#gold)" stroke-width="3"/>
  <!-- Camera bump -->
  <rect x="42" y="26" width="18" height="26" rx="6" fill="#1A0505" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="51" cy="34" r="4" fill="url(#gold)"/>
  <circle cx="51" cy="44" r="3" fill="url(#gold)"/>
  <!-- Sambalpuri / Ikat Diamond Motif in center of case -->
  <path d="M64 56 L76 68 L64 80 L52 68 Z" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M64 62 L70 68 L64 74 L58 68 Z" fill="url(#gold)"/>
